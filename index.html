<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coletor de Estoque por Lote - TI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-10">

  <!-- Cabeçalho -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold">📦 Contagem Rápida de Estoque</h1>
      <span id="totalContado" class="bg-indigo-800 text-xs px-2.5 py-1 rounded-full font-semibold">Total: 0</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 1. Carregar Base de Produtos -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">1. Base de Produtos (Excel/CSV)</h2>
      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
      <p id="dbStatus" class="text-xs text-slate-400 mt-2">Opcional: carregue para preencher a lista de itens.</p>
    </section>

    <!-- 2. Formulário de Contagem por Lote -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">2. Registrar Quantidade Visual</h2>

      <!-- Seleção ou Digitação do Produto -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Produto / Modelo</label>
        <select id="produtoSelect" class="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-base focus:ring-2 focus:ring-indigo-500 mb-2">
          <option value="">-- Carregue a base ou digite abaixo --</option>
        </select>
        <input type="text" id="produtoManualInput" placeholder="Ou digite o nome do item se não estiver na lista..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500" />
      </div>

      <!-- Estado / Condição -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Estado / Condição</label>
        <select id="condicaoSelect" class="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-base focus:ring-2 focus:ring-indigo-500">
          <option value="Bom Estado (OK)">Bom Estado (OK)</option>
          <option value="MS (Formatado sem imagem)">MS (Formatado sem imagem)</option>
          <option value="Defeito / Manutenção">Defeito / Manutenção</option>
          <option value="MS - Defeito / Manutenção">MS + Defeito / Manutenção</option>
          <option value="Novo / Lacrado">Novo / Lacrado</option>
          <option value="Para Descarte / Sucata">Para Descarte / Sucata</option>
        </select>
      </div>

      <!-- Quantidade -->
      <div class="flex gap-3">
        <div class="w-1/3">
          <label class="block text-xs font-medium text-slate-700 mb-1">Quantidade</label>
          <input type="number" id="qtdInput" value="1" min="1" class="w-full p-2.5 border border-slate-300 rounded-lg text-lg font-bold text-center text-indigo-600 focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="w-2/3">
          <label class="block text-xs font-medium text-slate-700 mb-1">Observação (Opcional)</label>
          <input type="text" id="obsInput" placeholder="Ex: teclado ruim, tela riscada..." class="w-full p-2.5 border border-slate-300 rounded-lg text-base focus:ring-2 focus:ring-indigo-500" />
        </div>
      </div>

      <button onclick="adicionarLote()" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold text-base shadow hover:bg-emerald-700 transition active:scale-98">
        + Adicionar ao Inventário
      </button>
    </section>

    <!-- 3. Resumo em Tempo Real -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">3. Itens Contados na Sessão</h2>
      <div id="resumoContainer" class="text-xs space-y-1.5 max-h-52 overflow-y-auto bg-slate-50 p-2.5 rounded border border-slate-200">
        <p class="text-slate-400 italic">Nenhum lote adicionado ainda.</p>
      </div>
    </section>

    <!-- 4. Exportar -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">4. Finalizar e Baixar</h2>
      <button onclick="exportarExcel()" class="w-full bg-slate-800 text-white py-3 rounded-lg font-bold text-base shadow hover:bg-slate-900 transition flex items-center justify-center gap-2">
        📥 Exportar Relatório Excel (.xlsx)
      </button>
    </section>

  </main>

  <script>
    let listaProdutosBase = [];
    let inventarioContado = [];

    // Carregar planilha base e popular o select de produtos
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.SheetNames[0];
        const dadosBrutos = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
        
        // Extrair nomes únicos de produtos
        listaProdutosBase = [];
        dadosBrutos.forEach(item => {
          const nome = String(item.Produto || item.Modelo || item.Item || item.Descricao || '').trim();
          if (nome && !listaProdutosBase.includes(nome)) {
            listaProdutosBase.push(nome);
          }
        });
        listaProdutosBase.sort();

        // Popular o select
        const select = document.getElementById('produtoSelect');
        select.innerHTML = '<option value="">-- Selecione da base carregada --</option>';
        listaProdutosBase.forEach(prod => {
          const opt = document.createElement('option');
          opt.value = prod;
          opt.textContent = prod;
          select.appendChild(opt);
        });

        document.getElementById('dbStatus').innerText = `✅ Base carregada! ${listaProdutosBase.length} produtos disponíveis.`;
        document.getElementById('dbStatus').className = "text-xs text-emerald-600 font-semibold mt-2";
      };
      reader.readAsArrayBuffer(file);
    });

    // Adicionar lote contado
    function adicionarLote() {
      const prodSelect = document.getElementById('produtoSelect').value;
      const prodManual = document.getElementById('produtoManualInput').value.trim();
      const produtoFinal = prodManual || prodSelect;

      if (!produtoFinal) {
        alert('Selecione um produto da lista ou digite o nome dele!');
        return;
      }

      const condicao = document.getElementById('condicaoSelect').value;
      const quantidade = parseInt(document.getElementById('qtdInput').value) || 0;
      const obs = document.getElementById('obsInput').value.trim();

      if (quantidade <= 0) {
        alert('A quantidade deve ser maior que zero!');
        return;
      }

      const registro = {
        Produto: produtoFinal,
        Estado: condicao,
        Quantidade: quantidade,
        Observacao: obs,
        Data_Hora: new Date().toLocaleString('pt-BR')
      };

      inventarioContado.push(registro);
      atualizarInterface();

      // Limpar campos de entrada mantendo a agilidade
      document.getElementById('produtoManualInput').value = '';
      document.getElementById('produtoSelect').value = '';
      document.getElementById('qtdInput').value = '1';
      document.getElementById('obsInput').value = '';
    }

    // Atualizar painel visual
    function atualizarInterface() {
      const totalGeral = inventarioContado.reduce((acc, curr) => acc + curr.Quantidade, 0);
      document.getElementById('totalContado').innerText = `Total: ${totalGeral}`;

      const resContainer = document.getElementById('resumoContainer');
      resContainer.innerHTML = '';

      if (inventarioContado.length === 0) {
        resContainer.innerHTML = '<p class="text-slate-400 italic">Nenhum lote adicionado ainda.</p>';
        return;
      }

      inventarioContado.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = "flex justify-between items-center py-1.5 border-b border-slate-200 last:border-0";
        div.innerHTML = `
          <div>
            <span class="font-semibold text-slate-800">${item.Produto}</span><br>
            <span class="text-slate-500 text-[11px]">${item.Estado} ${item.Observacao ? ' | ' + item.Observacao : ''}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded-full text-xs">${item.Qtd || item.Quantidade} un</span>
            <button onclick="removerItem(${index})" class="text-red-500 font-bold px-1 text-xs hover:text-red-700" title="Remover">✕</button>
          </div>
        `;
        resContainer.appendChild(div);
      });
    }

    // Remover item errado da lista
    function removerItem(index) {
      inventarioContado.splice(index, 1);
      atualizarInterface();
    }

    // Exportar para Excel
    function exportarExcel() {
      if (inventarioContado.length === 0) {
        alert('Adicione itens antes de exportar o relatório!');
        return;
      }

      const worksheet = XLSX.utils.json_to_sheet(inventarioContado);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Contagem_Estoque");

      const dataAtual = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(workbook, `Relatorio_Contagem_${dataAtual}.xlsx`);
    }
  </script>
</body>
</html>
