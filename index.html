<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coletor de Estoque e Auditoria TI</title>
  <!-- Tailwind CSS para visualização ágil e responsiva -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Biblioteca SheetJS para ler e gerar Excel no navegador -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-10">

  <!-- Cabeçalho -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold">📦 Coletor de Estoque</h1>
      <span id="totalContado" class="bg-indigo-800 text-xs px-2 py-1 rounded-full">Contados: 0</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Passo 1: Carregar Base do Excel -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-2">1. Base de Dados (Excel/CSV)</h2>
      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
      <p id="dbStatus" class="text-xs text-slate-400 mt-2">Nenhum banco de dados carregado.</p>
    </section>

    <!-- Passo 2: Formato de Coleta do Item -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">2. Registrar Item</h2>

      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Código / Patrimônio / Tag</label>
        <div class="flex gap-2">
          <input type="text" id="codigoInput" placeholder="Digite ou bipe o código..." class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-base" />
          <button id="btnBuscar" onclick="buscarItem()" class="bg-indigo-600 text-white px-4 rounded-lg font-medium hover:bg-indigo-700">Buscar</button>
        </div>
      </div>

      <!-- Dados Automáticos Preenchidos -->
      <div class="bg-slate-50 p-3 rounded-lg space-y-1 text-sm border border-slate-200">
        <div><span class="font-semibold text-slate-600">Modelo:</span> <span id="infoModelo" class="text-slate-800">-</span></div>
        <div><span class="font-semibold text-slate-600">Categoria:</span> <span id="infoCategoria" class="text-slate-800">-</span></div>
        <div><span class="font-semibold text-slate-600">Marca/Detalhes:</span> <span id="infoDetalhes" class="text-slate-800">-</span></div>
      </div>

      <!-- Dados Manuais do Almox -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Condição do Item</label>
        <select id="condicaoSelect" class="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-base">
          <option value="Novo / Lacrado">Novo / Lacrado</option>
          <option value="Usado - Bom Estado" selected>Usado - Bom Estado</option>
          <option value="Defeituoso / Danificado">Defeituoso / Danificado</option>
          <option value="Para Descarte/Sucata">Para Descarte / Sucata</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Observações da Auditoria</label>
        <input type="text" id="obsInput" placeholder="Ex: teclado ruim, tela queimada, sem cabo..." class="w-full p-2.5 border border-slate-300 rounded-lg text-base" />
      </div>

      <button onclick="salvarContagem()" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold text-base shadow hover:bg-emerald-700 transition">
        ✓ Salvar e Próximo Item
      </button>
    </section>

    <!-- Passo 3: Exportar Resultados -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-2">3. Concluir e Exportar</h2>
      <button onclick="exportarExcel()" class="w-full bg-slate-800 text-white py-3 rounded-lg font-bold text-base shadow hover:bg-slate-900 transition flex items-center justify-center gap-2">
        📥 Exportar Relatório Excel (.xlsx)
      </button>
    </section>

  </main>

  <script>
    let bancoDados = [];
    let contagem = [];
    let itemAtual = null;

    // Carregar planilha Excel/CSV para a memória da aplicação
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.SheetNames[0];
        bancoDados = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
        
        document.getElementById('dbStatus').innerText = `✅ Base carregada! Total de ${bancoDados.length} registros cadastrados.`;
        document.getElementById('dbStatus').className = "text-xs text-emerald-600 font-semibold mt-2";
      };
      reader.readAsArrayBuffer(file);
    });

    // Buscar código digitado na base importada
    function buscarItem() {
      const codigo = document.getElementById('codigoInput').value.trim();
      if (!codigo) {
        alert('Digite ou bipe um código para buscar!');
        return;
      }

      // Procura em colunas comuns (Tag, Patrimonio, Serial, ID, Codigo)
      itemAtual = bancoDados.find(item => {
        const val = String(item.Patrimonio || item.Tag || item.Serial || item.Codigo || item.ID || '').trim();
        return val.toLowerCase() === codigo.toLowerCase();
      });

      if (itemAtual) {
        document.getElementById('infoModelo').innerText = itemAtual.Modelo || itemAtual.Item || itemAtual.Descricao || 'N/A';
        document.getElementById('infoCategoria').innerText = itemAtual.Categoria || itemAtual.Tipo || 'N/A';
        document.getElementById('infoDetalhes').innerText = itemAtual.Marca || itemAtual.Detalhes || 'N/A';
      } else {
        alert('Código não encontrado na base carregada. Você pode registrar como item avulso se desejar.');
        document.getElementById('infoModelo').innerText = 'Item Avulso / Não Cadastrado';
        document.getElementById('infoCategoria').innerText = 'N/A';
        document.getElementById('infoDetalhes').innerText = 'N/A';
        itemAtual = { Codigo: codigo, Modelo: 'Não Cadastrado' };
      }
    }

    // Salva a validação do almoxarifado
    function salvarContagem() {
      const codigo = document.getElementById('codigoInput').value.trim();
      if (!codigo) {
        alert('Informe o código do equipamento!');
        return;
      }

      if (!itemAtual) {
        buscarItem();
      }

      const registro = {
        Codigo_Patrimonio: codigo,
        Modelo: itemAtual.Modelo || itemAtual.Item || itemAtual.Descricao || 'Avulso',
        Categoria: itemAtual.Categoria || itemAtual.Tipo || 'N/A',
        Condicao: document.getElementById('condicaoSelect').value,
        Observacao: document.getElementById('obsInput').value,
        Data_Hora: new Date().toLocaleString('pt-BR')
      };

      contagem.push(registro);

      // Atualizar contadores e limpar formulário
      document.getElementById('totalContado').innerText = `Contados: ${contagem.length}`;
      document.getElementById('codigoInput').value = '';
      document.getElementById('obsInput').value = '';
      document.getElementById('infoModelo').innerText = '-';
      document.getElementById('infoCategoria').innerText = '-';
      document.getElementById('infoDetalhes').innerText = '-';
      itemAtual = null;

      // Focar no campo de código para o próximo
      document.getElementById('codigoInput').focus();
    }

    // Exportar planilha preenchida
    function exportarExcel() {
      if (contagem.length === 0) {
        alert('Nenhum item foi auditado/contado ainda!');
        return;
      }

      const worksheet = XLSX.utils.json_to_sheet(contagem);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Auditoria_Almox");

      const dataAtual = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(workbook, `Relatorio_Estoque_${dataAtual}.xlsx`);
    }

    // Atalho: Tecla Enter no campo busca automaticamente
    document.getElementById('codigoInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        buscarItem();
      }
    });
  </script>
</body>
</html>
