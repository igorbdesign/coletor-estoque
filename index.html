<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle e Auditoria de Estoque TI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Cabeçalho -->
  <header class="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold">📦 Coletor de Almoxarifado</h1>
        <p class="text-[10px] text-indigo-200">Inventário de Ativos & Periféricos</p>
      </div>
      <span id="totalContado" class="bg-indigo-900 text-white text-xs px-2.5 py-1 rounded-full font-bold">Total: 0</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 1. Categoria do Item -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">1. Selecione a Categoria</h2>
      
      <div class="grid grid-cols-3 gap-2">
        <button onclick="selecionarCategoria('notebook')" id="btnCatNotebook" class="cat-btn bg-indigo-50 border-2 border-indigo-600 text-indigo-800 p-2.5 rounded-xl font-bold text-xs text-center flex flex-col items-center justify-center gap-1 transition">
          <span class="text-lg">💻</span> Notebooks
        </button>
        <button onclick="selecionarCategoria('ativo')" id="btnCatAtivo" class="cat-btn bg-slate-50 border border-slate-200 text-slate-600 p-2.5 rounded-xl font-semibold text-xs text-center flex flex-col items-center justify-center gap-1 transition">
          <span class="text-lg">📱</span> Outros Ativos
        </button>
        <button onclick="selecionarCategoria('periferico')" id="btnCatPeriferico" class="cat-btn bg-slate-50 border border-slate-200 text-slate-600 p-2.5 rounded-xl font-semibold text-xs text-center flex flex-col items-center justify-center gap-1 transition">
          <span class="text-lg">🎧</span> Periféricos
        </button>
      </div>
    </section>

    <!-- 2. Formulário Dinâmico baseado na Categoria -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider" id="tituloForm">2. Lançamento de Itens</h2>

      <!-- Modelo do Produto -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1" id="labelModelo">Modelo / Item</label>
        <select id="modeloSelect" class="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-sm font-medium focus:ring-2 focus:ring-indigo-500">
          <!-- Carregado via JS -->
        </select>
      </div>

      <!-- CAMPOS PARA NOTEBOOKS E ATIVOS -->
      <div id="painelAtivos" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Estado do Equipamento</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center gap-2 p-2.5 border rounded-lg bg-slate-50 cursor-pointer">
              <input type="radio" name="estadoAtivo" value="BOM" checked class="text-indigo-600 focus:ring-indigo-500">
              <span class="text-xs font-bold text-emerald-700">✓ Bom Estado</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 border rounded-lg bg-slate-50 cursor-pointer">
              <input type="radio" name="estadoAtivo" value="RUIM" class="text-indigo-600 focus:ring-indigo-500">
              <span class="text-xs font-bold text-red-600">✕ Defeito / Ruim</span>
            </label>
          </div>
        </div>

        <!-- Checkbox MS-SP (Notebook formatado sem imagem) -->
        <div class="bg-amber-50 border border-amber-200 p-3 rounded-lg">
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" id="chkMsSp" class="w-4 h-4 text-amber-600 rounded focus:ring-amber-500">
            <div>
              <span class="text-xs font-bold text-amber-900 block">MS-SP (Formatado / Sem Imagem)</span>
              <span class="text-[10px] text-amber-700 block">Marque se o equipamento está sem imagem/formatado</span>
            </div>
          </label>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Quantidade</label>
          <input type="number" id="qtdAtivoInput" value="1" min="1" class="w-full p-2.5 border border-slate-300 rounded-lg text-base font-bold text-indigo-700 text-center" />
        </div>
      </div>

      <!-- CAMPOS EXCLUSIVOS PARA PERIFÉRICOS E CONSUMÍVEIS -->
      <div id="painelPerifericos" class="hidden space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-emerald-700 mb-1">Qtd Boas (OK)</label>
            <input type="number" id="qtdBoaInput" value="0" min="0" class="w-full p-2.5 border border-emerald-300 bg-emerald-50 rounded-lg text-base font-bold text-emerald-800 text-center focus:ring-2 focus:ring-emerald-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-red-600 mb-1">Qtd Ruins (Defeito)</label>
            <input type="number" id="qtdRuimInput" value="0" min="0" class="w-full p-2.5 border border-red-300 bg-red-50 rounded-lg text-base font-bold text-red-700 text-center focus:ring-2 focus:ring-red-500" />
          </div>
        </div>
      </div>

      <!-- Observação Geral -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Observação (Opcional)</label>
        <input type="text" id="obsInput" placeholder="Ex: teclado queimado, cabo rasgado..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
      </div>

      <button onclick="salvarLancamento()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-emerald-700 transition active:scale-98">
        + Adicionar Registro ao Estoque
      </button>
    </section>

    <!-- 3. Resumo dos Itens Auditados -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">3. Itens Contados no Momento</h2>
      <div id="resumoContainer" class="text-xs space-y-2 max-h-56 overflow-y-auto bg-slate-50 p-2.5 rounded-lg border border-slate-200">
        <p class="text-slate-400 italic text-center py-2">Nenhum item adicionado nesta contagem.</p>
      </div>
    </section>

    <!-- 4. Exportar Planilha -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <button onclick="exportarExcel()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-sm shadow hover:bg-black transition flex items-center justify-center gap-2">
        📥 Exportar Relatório Excel (.xlsx)
      </button>
    </section>

  </main>

  <script>

    let categoriaAtual = 'notebook';
    let lancamentos = [];

    //
